name: GitHub Metrics

on:
  schedule:
    - cron: "0 6 * * *"          # daily at 06:00 UTC
  workflow_dispatch:              # manual trigger from the Actions tab
  push:
    branches: ["main"]            # refresh on push to main

permissions:
  contents: write                 # lets the action commit the SVGs back

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:

      # ----------------------------------------------------------------------
      #  1) SHOWCASE PANEL  →  metrics.svg
      #     Stats + language breakdown + coding habits + activity + achievements
      # ----------------------------------------------------------------------
      - name: Showcase panel
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}   # commit via GITHUB_TOKEN to avoid re-trigger loops
          user: Ahnafshariar
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Toronto

          # Language breakdown (colored bar)
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage, bytes-size
          plugin_languages_sections: most-used
          plugin_languages_colors: github

          # Lines of code changed
          plugin_lines: yes

      # ----------------------------------------------------------------------
      #  2) ISOMETRIC CALENDAR  →  metrics.isocalendar.svg
      #     3D full-year contribution calendar — the signature graphic
      # ----------------------------------------------------------------------
      - name: Isometric contribution calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Ahnafshariar
          base: ""
          config_timezone: America/Toronto
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
